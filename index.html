<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Space Formations — Top-Down Shooter</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05060f; touch-action:none; overscroll-behavior:none; }
  body { font-family:system-ui, -apple-system, sans-serif; position:fixed; inset:0; }
  #game { display:block; width:100%; height:100%; touch-action:none; }

  #hud {
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px; color:#fff; pointer-events:none;
    font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.9);
  }
  #hud .left { display:flex; flex-direction:column; gap:2px; }
  #hud .score { font-size:clamp(18px,4.5vw,32px); letter-spacing:1px; }
  #hud .wave { font-size:clamp(11px,2.8vw,16px); opacity:.7; }
  #hud .right { display:flex; gap:8px; align-items:center; }
  #hud .lives { display:flex; gap:4px; align-items:center; }
  #hud .lives .life { width:clamp(14px,3vw,22px); height:clamp(14px,3vw,22px); }

  #overlay {
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center;
    background:rgba(5,6,15,.85); color:#fff; backdrop-filter:blur(4px);
  }
  #overlay h1 { font-size:clamp(26px,7vw,48px); letter-spacing:3px; margin-bottom:4px;
    background:linear-gradient(180deg,#7ef0ff,#3aa8ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #overlay p { font-size:clamp(13px,3vw,18px); opacity:.85; max-width:520px; line-height:1.6; }
  #overlay .btn {
    pointer-events:auto; cursor:pointer; border:none; border-radius:14px;
    padding:14px 38px; font-size:clamp(16px,4vw,22px); font-weight:800;
    color:#0a0f1e; background:linear-gradient(180deg,#7ef0ff,#3aa8ff);
    box-shadow:0 4px 0 #1c6bb0, 0 8px 24px rgba(58,168,255,.4);
    transition:transform .1s;
  }
  #overlay .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #1c6bb0; }
  #overlay .hint { font-size:clamp(11px,2.6vw,15px); opacity:.6; }
  #overlay.hidden { display:none; }
  .controls-hint {
    position:fixed; bottom:8px; left:0; right:0; z-index:5; text-align:center;
    color:rgba(255,255,255,.35); font-size:clamp(9px,2.2vw,13px); pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<div id="hud">
  <div class="left">
    <div class="score">SCORE <span id="scoreVal">0</span></div>
    <div class="wave">WAVE <span id="waveVal">1</span></div>
  </div>
  <div class="right">
    <div class="lives" id="livesBox"></div>
  </div>
</div>
<div id="overlay">
  <h1>SPACE FORMATIONS</h1>
  <p>Drag the joystick to move your ship.<br>You fire automatically.<br>Weave through the enemy formations and survive the waves!</p>
  <button class="btn" id="startBtn">▶ START</button>
  <div class="hint">Best in landscape on a phone or tablet</div>
</div>
<div class="controls-hint">Left joystick = move · Autofire · Dodge the formations</div>
<canvas id="game"></canvas>

(function(){
  "use strict";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  // ---- Sprite loading ----
  const SPR = {};
  const spriteDefs = {
    ship: 'ship_A', enemy1: 'enemy_A', enemy2: 'enemy_C', enemy3: 'enemy_E',
    meteor: 'meteor_large', meteorSmall: 'meteor_small',
    star: 'star_small', starBig: 'star_large',
    effect: 'effect_yellow', station: 'station_A',
    joyPad: 'joystick_circle_pad_a', joyNub: 'joystick_circle_nub_a',
    hlJoyPad: 'joystick_circle_pad_highlight', hlJoyNub: 'joystick_circle_nub_highlight',
    iconPause: 'icon_pause', iconShield: 'icon_shield', iconStar: 'icon_star',
    btnSmall: 'button_circle'
  };
  function loadSprites(cb){
    let remaining = Object.keys(spriteDefs).length;
    for (const key in spriteDefs){
      const img = new Image();
      img.onload = img.onerror = function(){ SPR[key]=img; if(--remaining===0) cb(); };
      img.src = SPRITES[spriteDefs[key]];
    }
  }

  // ---- Game state ----
  let W=0, H=0, running=false, over=false, paused=false;
  let score=0, wave=1, lives=3, invuln=0;
  // Playfield: ship is free in the BOTTOM ZONE
  let player={x:0,y:0,vx:0,vy:0,radius:20,rapidFire:0,shield:0};
  let bullets=[], enemies=[], meteors=[], stars=[], particles=[], popups=[], powerups=[];
  let joyL={active:false,id:-1,ox:0,oy:0,dx:0,dy:0,mag:0};
  let fireCooldown=0, spawnTimer=0, waveTimer=0, lastTime=0;
  let shake=0, shakeX=0, shakeY=0;
  let bgStars=[];
  let PLAY_MIN_X=0, PLAY_MAX_X=0, PLAY_MIN_Y=0, PLAY_MAX_Y=0; // player movement bounds

  // ---- Layout ----
  const UI = {};
  function layout(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);

    const s = Math.min(W, H);
    UI.joyPad = s * 0.30;
    UI.joyNub = UI.joyPad * 0.48;
    UI.btnPause = s * 0.08;

    // Single joystick: bottom-left
    UI.joyL_x = UI.joyPad * 0.75;
    UI.joyL_y = H - UI.joyPad * 0.75;

    // Pause top-right
    UI.pause_x = W - UI.btnPause * 1.6;
    UI.pause_y = UI.btnPause * 1.6 + 30;

    // Player movement zone: full playfield (below HUD, above bottom edge)
    PLAY_MIN_X = 30;
    PLAY_MAX_X = W - 30;
    PLAY_MIN_Y = 70;          // below the HUD
    PLAY_MAX_Y = H - 70;      // above the bottom edge

    player.x = W * 0.5;
    player.y = PLAY_MAX_Y;

    // Background stars (scroll downward)
    bgStars = [];
    for (let i = 0; i < 110; i++) {
      bgStars.push({ x: Math.random()*W, y: Math.random()*H, z: 0.2+Math.random()*0.8, big: Math.random()<0.12, speed: (0.5+Math.random()*1.5) });
    }
  }

  // ---- Touch input (single joystick) ----
  function joyPos(joy, cx, cy){
    const dx=cx-joy.ox, dy=cy-joy.oy;
    const dist=Math.hypot(dx,dy);
    const max=UI.joyPad*0.42;
    const clamp=Math.min(dist,max);
    const ang=Math.atan2(dy,dx);
    joy.dx=dist>0?Math.cos(ang)*clamp/max:0;
    joy.dy=dist>0?Math.sin(ang)*clamp/max:0;
    joy.mag=clamp/max;
  }
  function pointInCircle(x,y,cx,cy,r){ return Math.hypot(x-cx,y-cy)<r; }
  function handleTouchStart(x,y,id){
    if (pointInCircle(x,y,UI.pause_x,UI.pause_y,UI.btnPause)){ togglePause(); return; }
    // Single joystick: anywhere on left 60% of screen activates it
    if (x < W*0.6 && !joyL.active){
      joyL.active=true; joyL.id=id;
      joyL.ox=UI.joyL_x; joyL.oy=UI.joyL_y;
      joyPos(joyL,x,y);
    }
  }
  function handleTouchMove(x,y,id){ if (joyL.active && id===joyL.id) joyPos(joyL,x,y); }
  function handleTouchEnd(id){
    if (joyL.active && id===joyL.id){ joyL.active=false; joyL.dx=joyL.dy=joyL.mag=0; }
  }
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); for(const t of e.changedTouches) handleTouchStart(t.clientX,t.clientY,t.identifier); },{passive:false});
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); for(const t of e.changedTouches) handleTouchMove(t.clientX,t.clientY,t.identifier); },{passive:false});
  canvas.addEventListener('touchend', e=>{ e.preventDefault(); for(const t of e.changedTouches) handleTouchEnd(t.identifier); },{passive:false});
  canvas.addEventListener('touchcancel', e=>{ for(const t of e.changedTouches) handleTouchEnd(t.identifier); },{passive:false});

  // Mouse fallback
  let mouseDown=false;
  canvas.addEventListener('mousedown', e=>{ mouseDown=true; handleTouchStart(e.clientX,e.clientY,-1); });
  canvas.addEventListener('mousemove', e=>{ if(mouseDown) handleTouchMove(e.clientX,e.clientY,-1); });
  window.addEventListener('mouseup', ()=>{ mouseDown=false; handleTouchEnd(-1); });

  // Keyboard fallback
  const keys={};
  window.addEventListener('keydown', e=>{ keys[e.code]=true; });
  window.addEventListener('keyup', e=>{ keys[e.code]=false; });

  // ---- Game logic ----
  function reset(){
    score=0; wave=1; lives=3; invuln=0;
    bullets=[]; enemies=[]; meteors=[]; particles=[]; popups=[]; powerups=[];
    player.x=W*0.5; player.y=PLAY_MAX_Y; player.vx=0; player.vy=0;
    player.rapidFire=0; player.shield=0;
    spawnTimer=0; waveTimer=0; fireCooldown=0; shake=0;
    over=false; paused=false; running=true;
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('scoreVal').textContent='0';
    document.getElementById('waveVal').textContent='1';
    updateLives();
  }
  function updateLives(){
    const box=document.getElementById('livesBox');
    box.innerHTML='';
    for(let i=0;i<lives;i++){ const img=document.createElement('img'); img.className='life'; img.src=SPRITES.ship_A; box.appendChild(img); }
  }
  function togglePause(){ if(!running||over) return; paused=!paused; if(!paused) lastTime=performance.now(); }

  // ---- Formation spawning (enemies from top) ----
  function spawnFormation(){
    const type = (wave % 4);
    const gap = Math.max(70, W*0.14); // guaranteed passable gap
    const gapX = 40 + Math.random()*(W-gap-80);
    const baseSpeed = 35 + wave*6;

    if (type===0){ // ROW: single horizontal line, one gap
      const count = Math.min(6, 4 + Math.floor(wave/2));
      const spacing = W/(count+1);
      for(let i=0;i<count;i++){
        const x = spacing*(i+1);
        if (Math.abs(x-gapX) < gap) continue; // leave the gap
        enemies.push(mkEnemy('enemy1', x, -50, baseSpeed, 'row'));
      }
    }
    else if (type===1){ // COLUMN: vertical stream with side offsets
      const lanes = [W*0.25, W*0.45, W*0.75, W*0.85];
      for(const lx of lanes){
        if (Math.abs(lx-gapX) < gap) continue;
        for(let d=0;d<2;d++){
          const delay = d*70;
          enemies.push(mkEnemy('enemy2', lx, -60-delay, baseSpeed*1.3, 'col'));
        }
      }
    }
    else if (type===2){ // CHECKER: two staggered rows, serpentine path
      const count = Math.min(7, 5 + Math.floor(wave/2));
      const spacing = W/(count+1);
      for(let row=0;row<2;row++){
        const y = -50 - row*80;
        for(let i=0;i<count;i++){
          const x = spacing*(i+1) + (row===1?spacing*0.5:0);
          if (Math.abs(x-gapX) < gap) continue;
          enemies.push(mkEnemy(row===1?'enemy3':'enemy1', x, y, baseSpeed*0.9, 'check'));
        }
      }
    }
    else { // MOVING WALL: two walls sliding opposite directions
      const gapMid = W/2 + (Math.random()-0.5)*W*0.2;
      const speed = baseSpeed*1.1;
      for(let i=0;i<3;i++){
        const lx = W*0.1 + i*W*0.12;
        enemies.push(mkEnemy('enemy2', lx, -40-i*60, speed, 'wallL', 1));
      }
      for(let i=0;i<3;i++){
        const rx = W*0.9 - i*W*0.12;
        enemies.push(mkEnemy('enemy1', rx, -40-i*60, speed, 'wallR', -1));
      }
    }
    spawnMeteor();
  }
  function mkEnemy(type, x, y, speed, formation, dir){
    let hp, radius;
    if(type==='enemy1'){ hp=2; radius=22; }
    else if(type==='enemy2'){ hp=1; radius=18; }
    else { hp=4; radius=26; }
    return { x, y, type, hp, maxHp:hp, radius, speed, formation, dir:dir||0, angle:Math.random()*Math.PI*2, hitFlash:0, active:false };
  }
  function spawnMeteor(){
    if (Math.random()>0.5) return;
    const x = 40+Math.random()*(W-80);
    const big = Math.random()<0.5;
    meteors.push({ x, y:-40, vy:(50+wave*8)*(big?0.8:1.1), vx:(Math.random()-0.5)*40, radius:big?26:16, angle:Math.random()*Math.PI*2, rot:(Math.random()-0.5)*3, big });
  }

  function fire(){
    if (fireCooldown>0) return;
    const rapid = player.rapidFire>0;
    fireCooldown = rapid?0.08:0.16;
    bullets.push({ x:player.x-10, y:player.y-24, vx:0, vy:-560, radius:4, life:1.2 });
    bullets.push({ x:player.x+10, y:player.y-24, vx:0, vy:-560, radius:4, life:1.2 });
    if (rapid){
      bullets.push({ x:player.x, y:player.y-24, vx:0, vy:-620, radius:4, life:1.3 });
    }
  }
  function explode(x,y,color,count){
    count=count||16;
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2; const sp=50+Math.random()*200;
      particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.3+Math.random()*0.5, max:0.8, size:2+Math.random()*5, color });
    }
  }
  function addPopup(x,y,text,color){ popups.push({ x, y, text, color, life:1, vy:-50 }); }
  function hitPlayer(x,y){
    if (invuln>0) return false;
    if (player.shield>0){ player.shield=0; invuln=1.2; shake=8; explode(x,y,'#7ef0ff',12); addPopup(player.x,player.y-30,'SHIELD DOWN!','#7ef0ff'); return false; }
    lives--; updateLives(); invuln=2.5; shake=16;
    explode(player.x,player.y,'#ff6b6b',24);
    if (lives<=0){ gameOver(); return true; }
    return false;
  }
  function spawnPowerup(x,y){
    if (Math.random()>0.10) return;
    const types=['rapid','shield','life'];
    const type=types[Math.floor(Math.random()*types.length)];
    powerups.push({ x, y, type, vy:40, life:9, radius:16, angle:0 });
  }

  function update(dt){
    if (shake>0){ shake-=dt*40; shakeX=(Math.random()-0.5)*shake; shakeY=(Math.random()-0.5)*shake; }
    else { shake=0; shakeX=0; shakeY=0; }

    // Player movement (single joystick)
    const speed = 330*(keys.ShiftLeft?1.6:1);
    let mx=0, my=0;
    if (joyL.active){ mx=joyL.dx; my=joyL.dy; }
    if (keys.ArrowLeft||keys.KeyA) mx-=1;
    if (keys.ArrowRight||keys.KeyD) mx+=1;
    if (keys.ArrowUp||keys.KeyW) my-=1;
    if (keys.ArrowDown||keys.KeyS) my+=1;
    const mag=Math.hypot(mx,my);
    if (mag>1){ mx/=mag; my/=mag; }
    player.vx+=(mx*speed-player.vx)*Math.min(1,dt*12);
    player.vy+=(my*speed-player.vy)*Math.min(1,dt*12);
    player.x+=player.vx*dt; player.y+=player.vy*dt;
    player.x=Math.max(PLAY_MIN_X,Math.min(PLAY_MAX_X,player.x));
    player.y=Math.max(PLAY_MIN_Y,Math.min(PLAY_MAX_Y,player.y));

    // Autofire
    fire();
    fireCooldown-=dt;

    // Power-up timers
    if (player.rapidFire>0) player.rapidFire-=dt;
    if (player.shield>0) player.shield-=dt;
    if (invuln>0) invuln-=dt;

    // Background stars scroll down
    for(const s of bgStars){ s.y+=s.speed*dt*60; if(s.y>H+10){ s.y=-10; s.x=Math.random()*W; } }

    // Bullets
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i]; b.y+=b.vy*dt; b.life-=dt;
      if (b.life<=0||b.y<-20){ bullets.splice(i,1); continue; }
      for(let j=enemies.length-1;j>=0;j--){
        const en=enemies[j];
        if (Math.hypot(b.x-en.x,b.y-en.y)<b.radius+en.radius){
          en.hp--; en.hitFlash=0.15; bullets.splice(i,1);
          if (en.hp<=0){
            const pts=en.type==='enemy3'?300:en.type==='enemy2'?150:100;
            score+=pts; explode(en.x,en.y,en.type==='enemy3'?'#ff9d4d':'#ffd166',18);
            addPopup(en.x,en.y,'+'+pts,'#ffd166'); spawnPowerup(en.x,en.y);
            enemies.splice(j,1);
          } else { explode(b.x,b.y,'#7ef0ff',5); }
          break;
        }
      }
      for(let j=meteors.length-1;j>=0;j--){
        const m=meteors[j];
        if (Math.hypot(b.x-m.x,b.y-m.y)<b.radius+m.radius){
          if (m.big){ m.radius-=4; bullets.splice(i,1); explode(b.x,b.y,'#aaa',4); }
          else { score+=25; explode(m.x,m.y,'#aaa',8); addPopup(m.x,m.y,'+25','#aaa'); meteors.splice(j,1); }
          break;
        }
      }
    }

    // Enemies (formations descend; some slide horizontally)
    for(let i=enemies.length-1;i>=0;i--){
      const en=enemies[i];
      en.y+=en.speed*dt;
      if (en.formation==='wallL') en.x+=W*0.10*dt;
      if (en.formation==='wallR') en.x-=W*0.10*dt;
      en.angle+=dt*2;
      if (en.hitFlash>0) en.hitFlash-=dt;
      if (en.y>H+50){ enemies.splice(i,1); continue; }
      if (Math.hypot(en.x-player.x,en.y-player.y)<en.radius+player.radius){
        if (!hitPlayer(en.x,en.y)){ explode(en.x,en.y,'#ff6b6b',10); enemies.splice(i,1); }
        else return;
      }
    }

    // Meteors
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];
      m.y+=m.vy*dt; m.x+=m.vx*dt; m.angle+=m.rot*dt;
      if (m.y>H+80){ meteors.splice(i,1); continue; }
      if (Math.hypot(m.x-player.x,m.y-player.y)<m.radius+player.radius){
        if (!hitPlayer(m.x,m.y)){ explode(m.x,m.y,'#ff6b6b',12); meteors.splice(i,1); }
        else return;
      }
    }

    // Power-ups
    for(let i=powerups.length-1;i>=0;i--){
      const p=powerups[i]; p.y+=p.vy*dt; p.life-=dt; p.angle+=dt*3;
      if (p.life<=0){ powerups.splice(i,1); continue; }
      if (Math.hypot(p.x-player.x,p.y-player.y)<p.radius+player.radius){
        if (p.type==='rapid'){ player.rapidFire=8; addPopup(player.x,player.y-30,'RAPID FIRE!','#ffd166'); }
        else if (p.type==='shield'){ player.shield=6; addPopup(player.x,player.y-30,'SHIELD UP!','#7ef0ff'); }
        else if (p.type==='life'){ lives++; updateLives(); addPopup(player.x,player.y-30,'+1 LIFE','#7eff7e'); }
        explode(p.x,p.y,'#fff',8); powerups.splice(i,1);
      }
    }

    // Particles
    for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; p.vx*=0.96; p.vy*=0.96; if(p.life<=0) particles.splice(i,1); }
    for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0) popups.splice(i,1); }

    // Wave progression
    waveTimer+=dt;
    if (waveTimer>22){ waveTimer=0; wave++; document.getElementById('waveVal').textContent=wave; spawnFormation(); }
    spawnTimer-=dt;
    if (spawnTimer<=0 && enemies.length<4){ spawnFormation(); spawnTimer=2.2; }

    document.getElementById('scoreVal').textContent=score;
  }

  function gameOver(){
    over=true; running=false;
    const ov=document.getElementById('overlay');
    ov.querySelector('h1').textContent='GAME OVER';
    ov.querySelector('p').innerHTML='Final score: <b style="color:#ffd166">'+score+'</b> · Wave '+wave+'<br>Nice weaving, pilot!';
    ov.querySelector('.btn').textContent='↻ PLAY AGAIN';
    ov.classList.remove('hidden');
  }

  // ---- Rendering ----
  function drawSprite(key,x,y,w,h,rot){
    const img=SPR[key];
    if (!img||!img.complete||img.naturalWidth===0) return;
    ctx.save(); ctx.translate(x,y); if(rot) ctx.rotate(rot);
    ctx.drawImage(img,-w/2,-h/2,w,h); ctx.restore();
  }
  function render(){
    ctx.save(); ctx.translate(shakeX,shakeY);
    ctx.fillStyle='#05060f'; ctx.fillRect(-20,-20,W+40,H+40);

    // Parallax stars
    for(const s of bgStars){ ctx.globalAlpha=0.2+s.z*0.6; drawSprite(s.big?'starBig':'star',s.x,s.y,(s.big?16:10)*s.z+4,(s.big?16:10)*s.z+4,0); }
    ctx.globalAlpha=1;

    // Meteors
    for(const m of meteors) drawSprite(m.big?'meteor':'meteorSmall',m.x,m.y,m.radius*2.4,m.radius*2.4,m.angle);

    // Enemies (point up toward player)
    for(const en of enemies){
      const size=en.type==='enemy3'?52:en.type==='enemy2'?42:46;
      if (en.hitFlash>0){ ctx.globalAlpha=0.5; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(en.x,en.y,size*0.6,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
      drawSprite(en.type,en.x,en.y,size,size,0);
    }

    // Bullets (upward streaks)
    ctx.fillStyle='#7ef0ff'; ctx.shadowColor='#3aa8ff'; ctx.shadowBlur=6;
    for(const b of bullets){ ctx.save(); ctx.translate(b.x,b.y); ctx.fillRect(-2,-10,4,20); ctx.restore(); }
    ctx.shadowBlur=0;

    // Power-ups
    for(const p of powerups){
      const fade=Math.min(1,p.life/2);
      const pulse=1+Math.sin(p.angle*5)*0.15;
      ctx.globalAlpha=fade;
      drawSprite('btnSmall',p.x,p.y,36*pulse,36*pulse,0);
      const icon=p.type==='rapid'?'iconFire':p.type==='shield'?'iconShield':'iconStar';
      drawSprite(icon,p.x,p.y,24*pulse,24*pulse,0);
    }
    ctx.globalAlpha=1;

    // Player (points north, rotation 0)
    if (invuln<=0||Math.floor(invuln*12)%2===0){
      if (player.shield>0){ ctx.globalAlpha=0.3+Math.sin(Date.now()/100)*0.15; ctx.strokeStyle='#7ef0ff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(player.x,player.y,34,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; }
      drawSprite('ship',player.x,player.y,50,50,0);
      // engine trail
      const boostHeld=keys.ShiftLeft;
      if (boostHeld||joyL.active&&joyL.mag>0.8){
        for(let i=0;i<3;i++){ ctx.globalAlpha=0.4-i*0.12; ctx.fillStyle='#7ef0ff'; ctx.beginPath(); ctx.arc(player.x,player.y+22+i*8,4-i,0,Math.PI*2); ctx.fill(); }
        ctx.globalAlpha=1;
      }
    }

    // Particles
    for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;

    // Score popups
    ctx.font='bold 16px system-ui'; ctx.textAlign='center';
    for(const p of popups){ ctx.globalAlpha=Math.min(1,p.life); ctx.fillStyle=p.color; ctx.fillText(p.text,p.x,p.y); }
    ctx.globalAlpha=1;

    ctx.restore();

    // Single joystick (bottom-left)
    const lx=UI.joyL_x, ly=UI.joyL_y;
    ctx.globalAlpha=joyL.active?0.75:0.38;
    drawSprite('joyPad',lx,ly,UI.joyPad,UI.joyPad,0);
    ctx.globalAlpha=1;
    drawSprite('joyNub',lx+joyL.dx*UI.joyPad*0.24,ly+joyL.dy*UI.joyPad*0.24,UI.joyNub,UI.joyNub,0);

    // Pause button
    drawSprite('btnSmall',UI.pause_x,UI.pause_y,UI.btnPause*2,UI.btnPause*2,0);
    drawSprite('iconPause',UI.pause_x,UI.pause_y,UI.btnPause*0.7,UI.btnPause*0.7,0);

    // Active power-up indicators
    let puiX=16, puiY=58;
    if (player.rapidFire>0){ drawSprite('btnSmall',puiX+16,puiY+16,28,28,0); drawSprite('iconShield',puiX+16,puiY+16,18,18,0); ctx.fillStyle='#ffd166'; ctx.font='bold 11px system-ui'; ctx.textAlign='center'; ctx.fillText('RAPID',puiX+16,puiY+42); }
    if (player.shield>0){ drawSprite('btnSmall',puiX+16,puiY+16,28,28,0); drawSprite('iconShield',puiX+16,puiY+16,18,18,0); ctx.fillStyle='#7ef0ff'; ctx.font='bold 11px system-ui'; ctx.textAlign='center'; ctx.fillText(Math.ceil(player.shield),puiX+16,puiY+42); }

    if (paused){ ctx.fillStyle='rgba(5,6,15,0.6)'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.font='bold 32px system-ui'; ctx.textAlign='center'; ctx.fillText('PAUSED',W/2,H/2); }
  }

  // ---- Main loop ----
  function loop(t){
    const dt=Math.min(0.05,(t-lastTime)/1000||0.016);
    lastTime=t;
    if (running&&!over&&!paused) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---- Init ----
  window.addEventListener('resize',layout);
  window.addEventListener('orientationchange',()=>setTimeout(layout,100));
  document.getElementById('startBtn').addEventListener('click',reset);
  loadSprites(()=>{ layout(); lastTime=performance.now(); requestAnimationFrame(loop); });
})();
</script>
</body>
